<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tax Owing Tracker</title>
  <style>
    :root {
      --bg: #0e0e0e;
      --panel: #161616;
      --input: #0f0f0f;
      --border: #333333;
      --border-soft: #2a2a2a;
      --text: #f5f5f5;
      --muted: #9a9a9a;
      --muted2: #7a7a7a;
      --accent: #ff5f57;
      --accent2: #ffb347;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 32px 20px;
    }

    .screen {
      width: min(100%, 920px);
      height: auto;
      overflow: visible;
      background: var(--panel);
      border: 1px solid var(--border-soft);
      border-radius: 16px;
      padding: 22px;
      scrollbar-width: thin;
      scrollbar-color: rgba(119,119,119,.35) transparent;
    }

    .screen::-webkit-scrollbar { width: 5px; }
    .screen::-webkit-scrollbar-thumb {
      background: rgba(119,119,119,.35);
      border-radius: 999px;
    }

    .top-row {
      display: flex;
      align-items: center;
      gap: 13px;
      margin-top: 18px;
    }

    h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
    }

    h2 {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
    }

    .fy-label {
      min-width: 292px;
      color: var(--text);
      font-size: 15px;
    }

    button, input {
      font: inherit;
    }

    .small-btn,
    .main-btn,
    .date-btn {
      background: var(--input);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      cursor: pointer;
      height: 34px;
    }

    .small-btn {
      padding: 5px 10px;
      min-width: 53px;
    }

    .reset-btn { width: 137px; }
    .help-btn { width: 53px; }

    /* Desktop top row: keep FY navigation together and push utility buttons right. */
    @media (min-width: 681px) {
      .fy-label {
        min-width: 175px;
      }

      .reset-btn {
        margin-left: auto;
      }
    }

    .money-area {
      position: relative;
      min-height: 124px;
      margin-top: 10px;
    }

    .threshold {
      position: absolute;
      left: 0;
      top: 0;
      color: var(--muted);
      font-size: 15px;
    }

    .tax-info {
      position: absolute;
      right: 0;
      top: -6px;
      width: 334px;
      text-align: right;
      color: var(--muted);
      line-height: 1.45;
      font-size: 15px;
    }

    .rate {
      color: var(--muted2);
    }

    .total {
      position: absolute;
      top: 46px;
      left: 50%;
      transform: translateX(-50%);
      width: 300px;
      text-align: center;
      font-size: 20px;
      font-weight: 700;
    }

    .bar {
      position: absolute;
      left: 0;
      right: 0;
      top: 74px;
      height: 14px;
      background: #2a2a2a;
      border-radius: 999px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      border-radius: 999px;
      transition: width .18s ease;
    }

    .goal {
      position: absolute;
      left: 0;
      top: 100px;
      color: var(--muted2);
      font-size: 15px;
    }

    .entry-area {
      width: 438px;
      margin: 20px auto 0;
    }

    .entry-input {
      width: 100%;
      height: 46px;
      background: var(--input);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px;
      outline: none;
    }

    .entry-input::placeholder {
      color: #777;
    }

    .desc-date-row {
      display: flex;
      gap: 12px;
      margin-top: 10px;
    }

    #descInput {
      width: 316px;
    }

    .date-btn {
      width: 110px;
      height: 46px;
    }

    .button-row {
      width: 584px;
      margin: 12px auto 0;
      display: flex;
      gap: 20px;
    }

    .main-btn {
      height: 46px;
      font-weight: 600;
    }

    .income-btn { width: 278px; }
    .deduction-btn { width: 286px; }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 56px;
    }

    .section-head.deductions {
      margin-top: 16px;
    }

    .view-btn {
      width: 110px;
      height: 34px;
    }

    .preview-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 10px;
      min-height: 216px;
    }

    .card {
      background: #111111;
      border-radius: 6px;
      padding: 10px;
      min-height: 64px;
    }

    .card .amount {
      font-weight: 700;
      margin-bottom: 16px;
    }

    .card .desc {
      color: var(--muted);
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .log-screen { display: none; }

    .log-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .log-title-area {
      margin-top: 18px;
    }

    .tip {
      margin-top: 8px;
      color: #bdbdbd;
      font-size: 15px;
    }

    .count {
      margin-top: 8px;
      color: var(--muted);
      font-size: 15px;
    }

    .log-nav {
      display: flex;
      gap: 34px;
      margin-top: 42px;
    }

    .log-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-top: 18px;
    }

    .log-row {
      display: grid;
      grid-template-columns: 120px 1fr 30px;
      align-items: center;
      height: 34px;
      background: #111111;
      border: 1px solid #222222;
      padding: 0 8px;
      color: var(--text);
    }

    .log-row .log-desc {
      color: var(--muted);
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .delete-btn {
      background: transparent;
      border: none;
      color: var(--accent);
      cursor: pointer;
      font-size: 18px;
      height: 28px;
    }

    .empty {
      color: var(--muted);
      margin-top: 8px;
    }

    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.7);
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 100;
    }

    .modal {
      background: var(--panel);
      border: 1px solid var(--border-soft);
      border-radius: 12px;
      padding: 18px;
      color: var(--text);
      width: min(100%, 570px);
      max-height: 92vh;
      overflow-y: auto;
    }

    .date-picker-grid {
      display: grid;
      grid-template-columns: 188px 1fr;
      gap: 26px;
      margin-top: 16px;
    }

    .picker-label {
      margin-bottom: 10px;
      color: var(--text);
    }

    .month-grid {
      display: grid;
      grid-template-columns: repeat(3, 58px);
      gap: 6px;
    }

    .day-grid {
      display: grid;
      grid-template-columns: repeat(7, 42px);
      gap: 5px;
    }

    .choice-btn {
      height: 34px;
      background: var(--input);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      cursor: pointer;
    }

    .day-grid .choice-btn {
      height: 32px;
    }

    .choice-btn.selected {
      background: #2f2f2f;
      border: 2px solid #f5f5f5;
      color: white;
    }

    .choice-btn.disabled {
      opacity: .3;
      pointer-events: none;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 18px;
    }

    .danger {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .help-text {
      white-space: pre-wrap;
      line-height: 1.35;
      color: var(--text);
    }

    @media (min-width: 681px) {
      .top-row {
        gap: 16px;
      }

      .section-head {
        margin-top: 42px;
      }

      .section-head.deductions {
        margin-top: 20px;
      }
    }

    @media (max-width: 680px) {
      body {
        align-items: flex-start;
        padding: 8px;
      }

      .screen {
        height: auto;
        min-height: 100vh;
        border-radius: 0;
      }

      .top-row {
        flex-wrap: wrap;
      }

      .fy-label {
        min-width: 200px;
      }

      .tax-info {
        position: static;
        text-align: left;
        width: auto;
        padding-top: 26px;
      }

      .money-area {
        min-height: 160px;
      }

      .total {
        top: 68px;
      }

      .bar {
        top: 100px;
      }

      .goal {
        top: 126px;
      }

      .entry-area,
      .button-row {
        width: 100%;
      }

      #descInput {
        width: calc(100% - 122px);
      }

      .button-row {
        gap: 12px;
      }

      .income-btn,
      .deduction-btn {
        width: 50%;
      }

      .date-picker-grid {
        grid-template-columns: 1fr;
      }

      .day-grid {
        grid-template-columns: repeat(7, minmax(34px, 1fr));
      }

      .month-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }
  </style>
</head>
<body>
  <main id="mainScreen" class="screen">
    <h1>Tax Owing Tracker</h1>

    <div class="top-row">
      <button class="small-btn" id="prevFY">&lt;</button>
      <div class="fy-label" id="fyLabel">Financial Year: 2025-2026</div>
      <button class="small-btn" id="nextFY">&gt;</button>
      <button class="small-btn reset-btn" id="resetBtn">Reset FY</button>
      <button class="small-btn help-btn" id="helpBtn">?</button>
    </div>

    <section class="money-area">
      <div class="threshold">$18,200</div>
      <div class="tax-info">
        <div id="taxEstimate"></div>
        <div id="rateLabel" class="rate"></div>
      </div>
      <div class="total" id="incomeDisplay">$0</div>
      <div class="bar"><div class="bar-fill" id="barFill"></div></div>
      <div class="goal">The goal is to bring this back to $18,200.</div>
    </section>

    <section class="entry-area">
      <input id="amountInput" class="entry-input" type="number" min="0" step="0.01" placeholder="Amount $" />
      <div class="desc-date-row">
        <input id="descInput" class="entry-input" type="text" maxlength="42" placeholder="Description" />
        <button id="dateBtn" class="date-btn">Date</button>
      </div>
    </section>

    <section class="button-row">
      <button class="main-btn income-btn" id="addIncome">Add Income</button>
      <button class="main-btn deduction-btn" id="addDeduction">Add Deduction</button>
    </section>

    <section>
      <div class="section-head">
        <h2>Income</h2>
        <button class="small-btn view-btn" id="viewIncome">View all</button>
      </div>
      <div id="incomePreview" class="preview-list"></div>
    </section>

    <section>
      <div class="section-head deductions">
        <h2>Deductions</h2>
        <button class="small-btn view-btn" id="viewDeductions">View all</button>
      </div>
      <div id="deductionPreview" class="preview-list"></div>
    </section>
  </main>

  <section id="incomeScreen" class="screen log-screen">
    <div class="log-top">
      <button class="small-btn" id="incomeBack">&lt; Back</button>
      <div class="log-nav">
        <button class="small-btn view-btn" id="incomeNewer">Newer</button>
        <button class="small-btn view-btn" id="incomeOlder">Older</button>
      </div>
    </div>
    <div class="log-title-area">
      <h2>Income Log</h2>
      <div class="tip">Enter your daily total after work</div>
      <div class="count" id="incomeCount">0 / 365 entries stored</div>
    </div>
    <div id="incomeLog" class="log-list"></div>
  </section>

  <section id="deductionScreen" class="screen log-screen">
    <div class="log-top">
      <button class="small-btn" id="deductionBack">&lt; Back</button>
      <div class="log-nav">
        <button class="small-btn view-btn" id="deductionNewer">Newer</button>
        <button class="small-btn view-btn" id="deductionOlder">Older</button>
      </div>
    </div>
    <div class="log-title-area">
      <h2>Deduction Log</h2>
      <div class="tip">Enter your daily total after work</div>
      <div class="count" id="deductionCount">0 / 365 entries stored</div>
    </div>
    <div id="deductionLog" class="log-list"></div>
  </section>

  <div class="modal-backdrop" id="dateModal">
    <div class="modal">
      <h2>Select date</h2>
      <div class="date-picker-grid">
        <div>
          <div class="picker-label">Month</div>
          <div class="month-grid" id="monthGrid"></div>
        </div>
        <div>
          <div class="picker-label">Day</div>
          <div class="day-grid" id="dayGrid"></div>
        </div>
      </div>
      <div class="modal-actions">
        <button class="small-btn" id="dateClear">Clear</button>
        <button class="small-btn" id="dateCancel">Cancel</button>
        <button class="small-btn" id="dateDone">Done</button>
      </div>
    </div>
  </div>

  <div class="modal-backdrop" id="helpModal">
    <div class="modal">
      <div id="helpText" class="help-text"></div>
      <div class="modal-actions">
        <button class="small-btn" id="helpContinue">Continue</button>
      </div>
    </div>
  </div>

  <div class="modal-backdrop" id="resetModal">
    <div class="modal" style="max-width:340px">
      <div id="resetText" class="help-text"></div>
      <div class="modal-actions">
        <button class="small-btn" id="resetNo">No</button>
        <button class="small-btn danger" id="resetYes">Yes</button>
      </div>
    </div>
  </div>

  <script>
    const BASE = 18200;
    const BAR_CAP = 150000;
    const MAX_ENTRIES = 365;
    const LOG_PAGE_SIZE = 50;

    const slides = [
      "LISTEN UP.\n\nThere are only two things you need to understand.",
      "INCOME\n\nIncome is money in.\n\nYou sold a $5 sandwich today.\nSomeone paid you $5 into your bank today.\n\nThat is INCOME.",
      "DEDUCTION\n\nA deduction is money you spent on your business.\n\nExample: $3 bread, $2 peanut butter, and an $8 knife to spread it.\n\nBOOM. Those are DEDUCTIONS.\n\nNow go. Get to it."
    ];

    let incomes = [];
    let deductions = [];
    let incomeLogPage = 0;
    let deductionLogPage = 0;
    let selectedMonth = 0;
    let selectedDay = 0;
    let pickerMonth = 0;
    let pickerDay = 0;
    let helpSlide = 0;

    const now = new Date();
    const baseFYStart = now.getMonth() + 1 >= 7 ? now.getFullYear() : now.getFullYear() - 1;
    let currentFYStart = Number(localStorage.getItem("taxTracker.currentFY")) || baseFYStart;

    function fyText() {
      return `${currentFYStart}-${currentFYStart + 1}`;
    }

    function key(prefix) {
      return `taxTracker.${prefix}${currentFYStart}`;
    }

    function cleanDesc(s) {
      return String(s || "").replace(/[\t\n\r]/g, " ").trim().slice(0, 42);
    }

    function monthShortName(m) {
      return ["", "Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"][m] || "";
    }

    function daysInMonth(m) {
      if (m === 2) return 29;
      if ([4, 6, 9, 11].includes(m)) return 30;
      return 31;
    }

    function selectedDateText() {
      if (!selectedMonth || !selectedDay) return "";
      return `${selectedDay} ${monthShortName(selectedMonth)}`;
    }

    function buildSavedDescWithDate(desc) {
      desc = cleanDesc(desc);
      const dt = selectedDateText();
      if (!dt) return desc;
      if (!desc) return dt;
      return cleanDesc(`${dt} - ${desc}`);
    }

    function money(value, cents = false) {
      const n = Number(value) || 0;
      const abs = Math.abs(n);
      const formatted = abs.toLocaleString("en-AU", {
        minimumFractionDigits: cents ? 2 : 0,
        maximumFractionDigits: cents ? 2 : 0
      });
      return `${n < 0 ? "-$" : "$"}${formatted}`;
    }

    function calcProgressiveTax(income) {
      const x = Math.max(Number(income) || 0, 0);
      let tax = 0;
      if (x > BASE) tax += (Math.min(x, 45000) - BASE) * 0.19;
      if (x > 45000) tax += (Math.min(x, 120000) - 45000) * 0.325;
      if (x > 120000) tax += (Math.min(x, 180000) - 120000) * 0.37;
      if (x > 180000) tax += (x - 180000) * 0.47;
      return tax;
    }

    function marginalRateLabel(income) {
      const x = Math.max(Number(income) || 0, 0);
      if (x <= BASE) return "";
      if (x <= 45000) return "19c owing for each $1";
      if (x <= 120000) return "32.5c owing for each $1";
      if (x <= 180000) return "37c owing for each $1";
      return "47c owing for each $1";
    }

    function totalOf(list) {
      return list.reduce((sum, e) => sum + (Number(e.amount) || 0), 0);
    }

    function saveCurrentFY() {
      localStorage.setItem(key("i"), JSON.stringify(incomes));
      localStorage.setItem(key("d"), JSON.stringify(deductions));
      localStorage.setItem("taxTracker.currentFY", String(currentFYStart));
    }

    function loadCurrentFY() {
      try {
        incomes = JSON.parse(localStorage.getItem(key("i")) || "[]");
        deductions = JSON.parse(localStorage.getItem(key("d")) || "[]");
      } catch {
        incomes = [];
        deductions = [];
      }
    }

    function addEntry(isIncome) {
      const amount = Number(document.getElementById("amountInput").value);
      if (!amount || amount <= 0) return;

      const entry = {
        amount,
        desc: buildSavedDescWithDate(document.getElementById("descInput").value)
      };

      const target = isIncome ? incomes : deductions;
      if (target.length >= MAX_ENTRIES) target.shift();
      target.push(entry);

      if (isIncome) incomeLogPage = 0;
      else deductionLogPage = 0;

      document.getElementById("amountInput").value = "";
      document.getElementById("descInput").value = "";
      selectedMonth = 0;
      selectedDay = 0;
      renderDateButton();
      updateUI();
    }

    function renderDateButton() {
      document.getElementById("dateBtn").textContent = selectedDateText() || "Date";
    }

    function renderPreviews() {
      renderPreview("incomePreview", incomes, false);
      renderPreview("deductionPreview", deductions, true);
    }

    function renderPreview(id, list, deduction) {
      const el = document.getElementById(id);
      el.innerHTML = "";

      const latest = list.slice(-3).reverse();
      if (!latest.length) {
        el.innerHTML = `<div class="empty">${deduction ? "No deductions added yet." : "No income added yet."}</div>`;
        return;
      }

      latest.forEach(entry => {
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          <div class="amount">${deduction ? "-" : ""}${money(entry.amount, false)}</div>
          <div class="desc">${entry.desc || "-"}</div>
        `;
        el.appendChild(card);
      });
    }

    function maxPageForCount(count) {
      if (count <= 0) return 0;
      return Math.floor((count - 1) / LOG_PAGE_SIZE);
    }

    function clampLogPages() {
      incomeLogPage = Math.max(0, Math.min(incomeLogPage, maxPageForCount(incomes.length)));
      deductionLogPage = Math.max(0, Math.min(deductionLogPage, maxPageForCount(deductions.length)));
    }

    function renderFullList(type) {
      clampLogPages();

      const isDeduction = type === "deduction";
      const list = isDeduction ? deductions : incomes;
      const page = isDeduction ? deductionLogPage : incomeLogPage;
      const log = document.getElementById(isDeduction ? "deductionLog" : "incomeLog");
      const count = document.getElementById(isDeduction ? "deductionCount" : "incomeCount");

      count.textContent = `${list.length} / ${MAX_ENTRIES} entries stored`;
      log.innerHTML = "";

      if (!list.length) {
        log.innerHTML = `<div class="empty">${isDeduction ? "No deductions added yet." : "No income added yet."}</div>`;
        return;
      }

      const startNewest = page * LOG_PAGE_SIZE;
      const endNewest = Math.min(startNewest + LOG_PAGE_SIZE, list.length);

      for (let newestPos = startNewest; newestPos < endNewest; newestPos++) {
        const realIndex = list.length - 1 - newestPos;
        const entry = list[realIndex];

        const row = document.createElement("div");
        row.className = "log-row";
        row.innerHTML = `
          <div>${isDeduction ? "-" : ""}${money(entry.amount, false)}</div>
          <div class="log-desc">${entry.desc || "-"}</div>
          <button class="delete-btn" title="Delete">x</button>
        `;

        row.querySelector("button").addEventListener("click", () => {
          list.splice(realIndex, 1);
          clampLogPages();
          updateUI();
          renderFullList(type);
        });

        log.appendChild(row);
      }
    }

    function updateUI() {
      const gross = totalOf(incomes);
      const ded = totalOf(deductions);
      const net = gross - ded;
      const tax = calcProgressiveTax(net);

      document.getElementById("fyLabel").textContent = `Financial Year: ${fyText()}`;
      document.getElementById("incomeDisplay").textContent = money(net, false);
      document.getElementById("taxEstimate").textContent = net > BASE ? `${money(tax, true)} tax owed estimate` : "";
      document.getElementById("rateLabel").textContent = marginalRateLabel(net);

      let pct = (net - BASE) / (BAR_CAP - BASE);
      pct = Math.max(0, Math.min(1, pct));
      document.getElementById("barFill").style.width = `${pct * 100}%`;

      renderPreviews();
      saveCurrentFY();
    }

    function showScreen(name) {
      document.getElementById("mainScreen").style.display = name === "main" ? "block" : "none";
      document.getElementById("incomeScreen").style.display = name === "income" ? "block" : "none";
      document.getElementById("deductionScreen").style.display = name === "deduction" ? "block" : "none";
    }

    function openDatePicker() {
      pickerMonth = selectedMonth || (new Date().getMonth() + 1);
      pickerDay = selectedDay || new Date().getDate();
      buildDatePicker();
      document.getElementById("dateModal").style.display = "flex";
    }

    function closeDatePicker() {
      document.getElementById("dateModal").style.display = "none";
    }

    function buildDatePicker() {
      const monthGrid = document.getElementById("monthGrid");
      const dayGrid = document.getElementById("dayGrid");

      monthGrid.innerHTML = "";
      dayGrid.innerHTML = "";

      for (let m = 1; m <= 12; m++) {
        const btn = document.createElement("button");
        btn.className = "choice-btn";
        btn.textContent = monthShortName(m);
        btn.addEventListener("click", () => {
          pickerMonth = m;
          if (pickerDay > daysInMonth(pickerMonth)) pickerDay = daysInMonth(pickerMonth);
          buildDatePicker();
        });
        if (m === pickerMonth) btn.classList.add("selected");
        monthGrid.appendChild(btn);
      }

      const maxDay = daysInMonth(pickerMonth);

      for (let d = 1; d <= 31; d++) {
        const btn = document.createElement("button");
        btn.className = "choice-btn";
        btn.textContent = d;
        if (d === pickerDay && d <= maxDay) btn.classList.add("selected");
        if (d > maxDay) btn.classList.add("disabled");
        btn.addEventListener("click", () => {
          pickerDay = d;
          buildDatePicker();
        });
        dayGrid.appendChild(btn);
      }
    }

    function openHelp() {
      helpSlide = 0;
      renderHelp();
      document.getElementById("helpModal").style.display = "flex";
    }

    function renderHelp() {
      document.getElementById("helpText").textContent = slides[helpSlide];
      document.getElementById("helpContinue").textContent = helpSlide === slides.length - 1 ? "Done" : "Continue";
    }

    document.getElementById("prevFY").addEventListener("click", () => {
      const next = currentFYStart - 1;
      if (next < baseFYStart - 3) return;
      saveCurrentFY();
      currentFYStart = next;
      incomeLogPage = 0;
      deductionLogPage = 0;
      loadCurrentFY();
      updateUI();
    });

    document.getElementById("nextFY").addEventListener("click", () => {
      const next = currentFYStart + 1;
      if (next > baseFYStart + 3) return;
      saveCurrentFY();
      currentFYStart = next;
      incomeLogPage = 0;
      deductionLogPage = 0;
      loadCurrentFY();
      updateUI();
    });

    document.getElementById("addIncome").addEventListener("click", () => addEntry(true));
    document.getElementById("addDeduction").addEventListener("click", () => addEntry(false));

    document.getElementById("viewIncome").addEventListener("click", () => {
      incomeLogPage = 0;
      renderFullList("income");
      showScreen("income");
    });

    document.getElementById("viewDeductions").addEventListener("click", () => {
      deductionLogPage = 0;
      renderFullList("deduction");
      showScreen("deduction");
    });

    document.getElementById("incomeBack").addEventListener("click", () => showScreen("main"));
    document.getElementById("deductionBack").addEventListener("click", () => showScreen("main"));

    document.getElementById("incomeOlder").addEventListener("click", () => {
      if (incomeLogPage < maxPageForCount(incomes.length)) incomeLogPage++;
      renderFullList("income");
    });

    document.getElementById("incomeNewer").addEventListener("click", () => {
      if (incomeLogPage > 0) incomeLogPage--;
      renderFullList("income");
    });

    document.getElementById("deductionOlder").addEventListener("click", () => {
      if (deductionLogPage < maxPageForCount(deductions.length)) deductionLogPage++;
      renderFullList("deduction");
    });

    document.getElementById("deductionNewer").addEventListener("click", () => {
      if (deductionLogPage > 0) deductionLogPage--;
      renderFullList("deduction");
    });

    document.getElementById("dateBtn").addEventListener("click", openDatePicker);
    document.getElementById("dateCancel").addEventListener("click", closeDatePicker);
    document.getElementById("dateClear").addEventListener("click", () => {
      selectedMonth = 0;
      selectedDay = 0;
      renderDateButton();
      closeDatePicker();
    });
    document.getElementById("dateDone").addEventListener("click", () => {
      selectedMonth = pickerMonth;
      selectedDay = Math.min(pickerDay, daysInMonth(pickerMonth));
      renderDateButton();
      closeDatePicker();
    });

    document.getElementById("helpBtn").addEventListener("click", openHelp);
    document.getElementById("helpContinue").addEventListener("click", () => {
      helpSlide++;
      if (helpSlide >= slides.length) {
        localStorage.setItem("taxTracker.seen", "true");
        document.getElementById("helpModal").style.display = "none";
      } else {
        renderHelp();
      }
    });

    document.getElementById("resetBtn").addEventListener("click", () => {
      document.getElementById("resetText").textContent = `Are you sure you want to reset ${fyText()}?`;
      document.getElementById("resetModal").style.display = "flex";
    });

    document.getElementById("resetNo").addEventListener("click", () => {
      document.getElementById("resetModal").style.display = "none";
    });

    document.getElementById("resetYes").addEventListener("click", () => {
      incomes = [];
      deductions = [];
      saveCurrentFY();
      updateUI();
      document.getElementById("resetModal").style.display = "none";
    });

    loadCurrentFY();
    renderDateButton();
    updateUI();

    if (localStorage.getItem("taxTracker.seen") !== "true") {
      openHelp();
    }
  </script>
</body>
</html>
